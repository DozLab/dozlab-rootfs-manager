# DozLab: per-session setup comes only from the NoCloud seed that the init container writes
# to /var/lib/cloud/seed/nocloud (on the session's writable disk, or into the rootfs when the
# VM has one read-write disk). Don't probe cloud metadata services.
datasource_list: [NoCloud, None]

# eth0 is configured by /etc/systemd/network/10-eth0.network (start-firecracker.sh's layout)
network: {config: disabled}

# Each VM replaces the host keys baked into the image with its own. Skip RSA: it is the slow
# one to generate, and the terminal sidecar and OpenSSH clients use ed25519/ecdsa.
ssh_genkeytypes: [ed25519, ecdsa]

# init.sh (the init container) owns disk sizing: before boot it creates the writable disk at
# the session's disk size, or grows the rootfs to it. cloud-init must not resize (its
# resize2fs /dev/vda also failed in testing).
resize_rootfs: false
growpart: {mode: "off"}
